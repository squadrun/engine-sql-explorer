name: Build wheel and attach to release

# Builds the compiled frontend and a Python wheel, then attaches the wheel
# (and sdist) to the GitHub Release that triggered this run. Consumers install
# the release-asset wheel directly, so the built static assets ship inside the
# package and no Node/Vite toolchain is required at install or deploy time.

on:
  release:
    types: [published]

permissions:
  contents: write # required to upload release assets

jobs:
  build-and-attach:
    name: Build wheel and attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # The vite_asset template tag resolves the content-hashed entry filename
      # through the Vite manifest. Without it (or its main.js entry) the page
      # loads an unhashed main.js that 404s while the build still exits 0.
      - name: Verify frontend manifest names the entry
        run: |
          python - <<'EOF'
          import json, os, sys
          out = "explorer/static/explorer"
          try:
              with open(f"{out}/manifest.json") as f:
                  entry = json.load(f)["explorer/src/js/main.js"]["file"]
          except (OSError, KeyError, ValueError) as e:
              sys.exit(f"::error::Vite manifest missing or has no main.js entry: {e!r}")
          if not os.path.isfile(f"{out}/{entry}"):
              sys.exit(f"::error::Vite manifest names {entry}, which was not built")
          print(f"main.js entry: {entry}")
          EOF

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist/ .

      - name: Verify wheel bundles the built static
        run: |
          python -m zipfile -l dist/*.whl | grep -q "explorer/static/explorer/manifest.json" \
            || { echo "::error::wheel does not contain built static assets"; exit 1; }

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz --clobber
